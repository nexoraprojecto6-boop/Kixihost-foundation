# Cloud-init aplicado a cada Droplet provisionado pelo KixiHost.
# A imagem base já vem com Docker (marketplace "docker-20-04"); aqui
# instalamos o Caddy (reverse proxy para o deploy blue/green) e o
# rsync (usado pelo Worker para sincronizar o código já construído).

#cloud-config
package_update: true
packages:
  - caddy
  - rsync

write_files:
  - path: /etc/caddy/Caddyfile
    content: |
      :80 {
        reverse_proxy localhost:8080
      }

runcmd:
  - mkdir -p /opt/kixihost/app
  - systemctl enable caddy
  - systemctl restart caddy
