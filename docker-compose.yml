# docker-compose.yml
#
# ATENÇÃO: Este ficheiro destina-se a AMBIENTE DE DESENVOLVIMENTO LOCAL OPCIONAL.
# A produção do KixiHost NUNCA depende deste ficheiro nem de `docker compose up`
# a correr no computador de um developer. Em produção, o PostgreSQL, Redis,
# API, Worker, Web e Admin correm na infraestrutura cloud (ver infrastructure/).
#
# Este ficheiro não é executado como parte da criação da fundação.

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kixihost
      POSTGRES_PASSWORD: kixihost
      POSTGRES_DB: kixihost
    ports:
      - "5432:5432"
    volumes:
      - kixihost_postgres_data:/var/lib/postgresql/data

  redis:
    image: valkey/valkey:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kixihost_redis_data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file: .env
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    env_file: .env
    depends_on:
      - api
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/admin.Dockerfile
    env_file: .env
    depends_on:
      - api
    ports:
      - "3001:3001"

volumes:
  kixihost_postgres_data:
  kixihost_redis_data:
